<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chambre Liminale - Exploration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }

        #world {
            position: absolute;
            width: 4000px;
            height: 3000px;
            background-image: url('room.png');
            background-repeat: repeat;
            background-size: 800px 600px;
            transform-origin: 0 0;
            transition: filter 0.3s ease;
        }

        /* Overlay sombre dynamique qui s'intensifie */
        #darkness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vw;
            pointer-events: none;
            z-index: 100;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 10%, rgba(0,0,0,0.85) 70%, rgba(0,0,0,0.98) 95%);
            mix-blend-mode: multiply;
            transition: background 0.2s ease;
        }

        /* Effet de scanlines et VHS */
        #vhs-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 101;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.7;
        }

        /* Effet glitch / bug visuel */
        .glitch-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 102;
            mix-blend-mode: exclusion;
            opacity: 0;
            background: rgba(255, 0, 85, 0.2);
        }

        @keyframes glitchFlash {
            0% { opacity: 0; transform: translate(0,0); }
            20% { opacity: 0.8; transform: translate(-10px, 5px); filter: invert(1); }
            40% { opacity: 0.2; transform: translate(15px, -5px); }
            60% { opacity: 0.9; transform: translate(-5px, -10px); filter: hue-rotate(90deg); }
            80% { opacity: 0.4; transform: translate(8px, 8px); }
            100% { opacity: 0; transform: translate(0,0); }
        }

        .active-glitch {
            animation: glitchFlash 0.4s steps(2, start) forwards;
        }

        /* Éléments cachés et énigmatiques disséminés */
        .hidden-item {
            position: absolute;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: rgba(255,255,255,0.08); /* Presque invisible au départ */
            border: 1px dashed transparent;
        }

        .hidden-item:hover {
            color: rgba(255,0,0,0.8);
            border-color: rgba(255,0,0,0.4);
            background: rgba(0,0,0,0.8);
            text-shadow: 0 0 8px red;
            transform: scale(1.1);
        }

        /* Fantômes / Apparitions soudaines */
        .phantom {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            font-family: monospace;
            font-weight: bold;
            color: #ff0033;
            text-shadow: 0 0 10px #000, 0 0 20px #ff0000;
            transition: opacity 0.1s ease;
        }

        /* Interface utilisateur minimaliste / Instructions */
        #hud {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 200;
            background: rgba(0,0,0,0.8);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 4px;
            max-width: 320px;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
        }

        #hud h1 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #hud p {
            font-size: 11px;
            color: #aaa;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .btn-start {
            background: #111;
            color: #ccc;
            border: 1px solid #555;
            padding: 8px 12px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            width: 100%;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-start:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Terminal ARG pop-up */
        #terminal-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 500px;
            max-width: 90vw;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #ff0033;
            z-index: 1000;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.4);
            display: none;
            opacity: 0;
            transition: all 0.3s ease;
        }

        #terminal-modal.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #terminal-header {
            font-size: 12px;
            color: #ff0033;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        #terminal-body {
            font-size: 12px;
            color: #00ff66;
            line-height: 1.5;
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .close-term {
            background: transparent;
            border: 1px solid #ff0033;
            color: #ff0033;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
        }
        .close-term:hover {
            background: #ff0033;
            color: #000;
        }

        #coords {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border: 1px solid #222;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="world"></div>
    <div id="darkness-overlay"></div>
    <div id="vhs-overlay"></div>
    <div id="glitch-layer" class="glitch-screen"></div>

    <div id="coords">POS: X: 0 | Y: 0 | PROFONDEUR: 0%</div>

    <div id="hud">
        <h1>[ PROTOCOLE LIMINAL ]</h1>
        <p>Utilisez les touches <b>ZQSD</b> ou les <b>Flèches Directionnelles</b> (ou cliquez-glissez) pour vous enfoncer dans la pièce. Plus vous avancez, plus la réalité se dégrade...</p>
        <button class="btn-start" id="init-btn">INITIALISER LA CONNEXION</button>
    </div>

    <div id="terminal-modal">
        <div id="terminal-header">
            <span>[ FICHIER CORROMPU ACCÉDÉ ]</span>
            <button class="close-term" onclick="closeTerminal()">[ FERMER ]</button>
        </div>
        <div id="terminal-body"></div>
    </div>

    <!-- Élément audio pour la musique d'ascenseur demandée -->
    <audio id="bg-audio" loop preload="auto">
        <source src="musique d'ascenseur d'attente son no copyright.mp3" type="audio/mpeg">
        Votre navigateur ne supporte pas l'élément audio.
    </audio>

    <script>
        const world = document.getElementById('world');
        const darknessOverlay = document.getElementById('darkness-overlay');
        const glitchLayer = document.getElementById('glitch-layer');
        const coordsDisplay = document.getElementById('coords');
        const hud = document.getElementById('hud');
        const audio = document.getElementById('bg-audio');
        const initBtn = document.getElementById('init-btn');
        const terminalModal = document.getElementById('terminal-modal');
        const terminalBody = document.getElementById('terminal-body');

        // Position initiale de la caméra (monde virtuel de 4000x3000)
        let posX = 1500;
        let posY = 1000;
        const speed = 15;
        
        let keys = {};
        let isStarted = false;
        let maxDistanceExplored = 0;

        // Textes cachés de l'ARG disséminés dans la map
        const argMessages = [
            { x: 400, y: 300, text: "[FRAGMENT #01]
Ils ont oublié de fermer la sortie secteur 4. Ne regardez pas derrière le papier peint.", hint: "Une tâche suspecte sur le mur..." },
            { x: 1200, y: 250, text: "[FRAGMENT #02]
La musique d'ascenseur ne s'arrête jamais. Même quand le haut-parleur fond.", hint: "Un murmure dans les fréquences..." },
            { x: 2200, y: 800, text: "[FRAGMENT #03]
ERREUR 404 : L'employé modèle 809 n'a jamais existé. Son bureau a été scellé.", hint: "Une lueur anormale..." },
            { x: 800, y: 1800, text: "[FRAGMENT #04]
Plus vous vous éloignez du centre, moins les textures retiennent la réalité. Fuyez.", hint: "Un chiffre gravé dans le bois..." },
            { x: 3000, y: 2200, text: "[FRAGMENT #05 - FICHIER MAÎTRE]
Vous êtes bloqué ici depuis 412 jours. Réveillez-vous.", hint: "Le bout du couloir infini..." },
            { x: 1800, y: 2600, text: "[FRAGMENT #06]
'room.png' pèse 4 téraoctets de données compressées. Ce n'est pas une image, c'est une cage.", hint: "Un pli dans l'espace..." }
        ];

        // Création dynamique des éléments cachés
        argMessages.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'hidden-item';
            div.style.left = item.x + 'px';
            div.style.top = item.y + 'px';
            div.innerHTML = `[ INDICE #${index + 1} ]`;
            div.title = item.hint;
            div.onclick = () => openTerminal(item.text);
            world.appendChild(div);
        });

        // Génération de fantômes / apparitions aléatoires (apparitions de texte en arrière-plan)
        const phantomTexts = [
            "ILS TE VOIENT", "TOURNES TOI", "ERREUR DE SYNCHRONISATION", 
            "CE N'EST PAS UNE PIÈCE", "AIDE MOI", "01001001 01001100", 
            "PLUS VITE", "LA MUSIQUE MASQUE LES CRIS"
        ];

        function spawnPhantom() {
            if (!isStarted) return;
            const p = document.createElement('div');
            p.className = 'phantom';
            p.textContent = phantomTexts[Math.floor(Math.random() * phantomTexts.length)];
            
            // Position par rapport à la caméra actuelle
            const rx = (posX + (Math.random() * window.innerWidth - window.innerWidth/2));
            const ry = (posY + (Math.random() * window.innerHeight - window.innerHeight/2));
            
            p.style.left = rx + 'px';
            p.style.top = ry + 'px';
            p.style.fontSize = (Math.random() * 20 + 10) + 'px';
            
            world.appendChild(p);

            // Animation d'apparition / disparition rapide
            setTimeout(() => { p.style.opacity = Math.random() * 0.7 + 0.2; }, 50);
            setTimeout(() => {
                p.style.opacity = 0;
                setTimeout(() => p.remove(), 500);
            }, Math.random() * 1200 + 400);
        }

        // Lancement de l'expérience
        initBtn.addEventListener('click', () => {
            isStarted = true;
            hud.style.display = 'none';
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Audio bloqué par le navigateur : interaction requise"));
            requestAnimationFrame(gameLoop);
        });

        // Gestion des contrôles clavier
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // Gestion du déplacement à la souris (cliquer-glisser)
        let isDragging = false;
        let startMouseX, startMouseY;
        window.addEventListener('mousedown', (e) => {
            if(!isStarted) return;
            isDragging = true;
            startMouseX = e.clientX;
            startMouseY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !isStarted) return;
            let dx = e.clientX - startMouseX;
            let dy = e.clientY - startMouseY;
            posX -= dx * 0.8;
            posY -= dy * 0.8;
            startMouseX = e.clientX;
            startMouseY = e.clientY;
            clampPosition();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        function clampPosition() {
            posX = Math.max(0, Math.min(3500, posX));
            posY = Math.max(0, Math.min(2500, posY));
        }

        // Boucle de jeu principale
        function gameLoop() {
            if (!isStarted) return;

            // Déplacements clavier ZQSD / Flèches
            if (keys['z'] || keys['arrowup']) posY -= speed;
            if (keys['s'] || keys['arrowdown']) posY += speed;
            if (keys['q'] || keys['arrowleft']) posX -= speed;
            if (keys['d'] || keys['arrowright']) posX += speed;

            clampPosition();

            // Appliquer la transformation du monde (effet caméra)
            world.style.transform = `translate(${-posX}px, ${-posY}px)`;

            // Calcul de la distance parcourue depuis le centre (1500, 1000) pour l'obscurité progressive
            let distanceFromCenter = Math.sqrt(Math.pow(posX - 1500, 2) + Math.pow(posY - 1000, 2));
            maxDistanceExplored = Math.max(maxDistanceExplored, distanceFromCenter);
            
            // Plus on avance, plus l'obscurité se resserre et devient intense
            let darknessFactor = Math.min(0.96, 0.4 + (distanceFromCenter / 1500) * 0.55);
            let innerRadius = Math.max(5, 50 - (distanceFromCenter / 30));
            darknessOverlay.style.background = `radial-gradient(circle at 50% 50%, rgba(0,0,0,0) ${innerRadius}%, rgba(0,0,0,${darknessFactor}) 65%, rgba(0,0,0,0.99) 90%)`;

            // Modification de l'ambiance visuelle (filtres de glitch et distorsion chromatique)
            let hueRotate = (distanceFromCenter / 10) % 360;
            let contrast = 100 + (distanceFromCenter / 15);
            world.style.filter = `hue-rotate(${hueRotate}deg) contrast(${contrast}%)`;

            // Affichage des coordonnées et de la profondeur psychologique
            let depthPercent = Math.min(100, Math.floor((distanceFromCenter / 1800) * 100));
            coordsDisplay.innerHTML = `POS: X:${Math.floor(posX)} | Y:${Math.floor(posY)} | PROFONDEUR: ${depthPercent}%`;

            // Effets de bugs visuels aléatoires (spawn de glitches de plus en plus fréquents)
            let glitchChance = 0.005 + (depthPercent * 0.001);
            if (Math.random() < glitchChance) {
                triggerGlitch();
            }

            // Spawn aléatoire de fantômes textuels
            if (Math.random() < 0.03) {
                spawnPhantom();
            }

            requestAnimationFrame(gameLoop);
        }

        function triggerGlitch() {
            glitchLayer.classList.add('active-glitch');
            
            // Distorsion audio ponctuelle (pitch ou volume si supporté, ou simple glitch visuel fort)
            if(audio.playbackRate === 1) {
                audio.playbackRate = Math.random() * 0.4 + 0.8;
                setTimeout(() => { audio.playbackRate = 1.0; }, 300);
            }

            setTimeout(() => {
                glitchLayer.classList.remove('active-glitch');
            }, 400);
        }

        function openTerminal(text) {
            terminalBody.textContent = text;
            terminalModal.classList.add('show');
        }

        function closeTerminal() {
            terminalModal.classList.remove('show');
        }
    </script>
</body>
</html>
